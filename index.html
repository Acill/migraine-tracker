<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Migraine Log & Doctor Report</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            box-shadow, .shadow-lg, .shadow-md { box-shadow: none !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Top Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md no-print">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-brain text-indigo-400 text-xl"></i>
                <h1 class="text-lg font-bold tracking-tight text-white">Migraine Tracker</h1>
            </div>
            <div class="flex space-x-2">
                <button onclick="switchTab('log')" id="btn-tab-log" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition">Log</button>
                <button onclick="switchTab('history')" id="btn-tab-history" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition">History</button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6">

        <!-- TAB 1: LOG MIGRAINE FORM -->
        <section id="tab-log" class="space-y-6">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-semibold text-white flex items-center gap-2">
                        <i class="fa-regular fa-pen-to-square text-indigo-400"></i> Record New Episode
                    </h2>
                    <span id="form-status" class="text-xs text-emerald-400 hidden"><i class="fa-solid fa-check"></i> Saved successfully!</span>
                </div>

                <form id="migraine-form" onsubmit="saveMigraine(event)" class="space-y-4">
                    <!-- Date & Time -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Date & Time</label>
                            <input type="datetime-local" id="entry-datetime" required
                                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Duration (Hours)</label>
                            <input type="number" id="entry-duration" step="0.5" min="0.1" placeholder="e.g., 4" required
                                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <!-- Severity Slider -->
                    <div>
                        <div class="flex justify-between text-xs font-medium text-slate-400 mb-1">
                            <span>Pain Severity (1 - 10)</span>
                            <span id="severity-val" class="font-bold text-indigo-400">5</span>
                        </div>
                        <input type="range" id="entry-severity" min="1" max="10" value="5" oninput="document.getElementById('severity-val').innerText = this.value"
                            class="w-full accent-indigo-500 bg-slate-900 cursor-pointer">
                    </div>

                    <!-- Symptoms Checkboxes -->
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-2">Symptoms Experienced</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            <label class="flex items-center space-x-3 bg-slate-900/60 border border-slate-700/60 p-2.5 rounded-xl cursor-pointer hover:border-slate-600 transition">
                                <input type="checkbox" name="symptom" value="Nausea" class="w-4 h-4 accent-indigo-500 rounded">
                                <span class="text-sm text-slate-200">Nausea</span>
                            </label>
                            <label class="flex items-center space-x-3 bg-slate-900/60 border border-slate-700/60 p-2.5 rounded-xl cursor-pointer hover:border-slate-600 transition">
                                <input type="checkbox" name="symptom" value="Sensitivity to light" class="w-4 h-4 accent-indigo-500 rounded">
                                <span class="text-sm text-slate-200">Sensitivity to light (Photophobia)</span>
                            </label>
                            <label class="flex items-center space-x-3 bg-slate-900/60 border border-slate-700/60 p-2.5 rounded-xl cursor-pointer hover:border-slate-600 transition">
                                <input type="checkbox" name="symptom" value="Sensitivity to sound" class="w-4 h-4 accent-indigo-500 rounded">
                                <span class="text-sm text-slate-200">Sensitivity to sound (Phonophobia)</span>
                            </label>
                            <label class="flex items-center space-x-3 bg-slate-900/60 border border-slate-700/60 p-2.5 rounded-xl cursor-pointer hover:border-slate-600 transition">
                                <input type="checkbox" name="symptom" value="Changes in vision" class="w-4 h-4 accent-indigo-500 rounded">
                                <span class="text-sm text-slate-200">Changes in vision / Aura</span>
                            </label>
                            <label class="flex items-center space-x-3 bg-slate-900/60 border border-slate-700/60 p-2.5 rounded-xl cursor-pointer hover:border-slate-600 transition sm:col-span-2">
                                <input type="checkbox" name="symptom" value="Other sensory changes" class="w-4 h-4 accent-indigo-500 rounded">
                                <span class="text-sm text-slate-200">Other sensory changes (Numbness, tingling, etc.)</span>
                            </label>
                        </div>
                    </div>

                    <!-- Medication Used -->
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Medication Used</label>
                        <input type="text" id="entry-medication" placeholder="e.g., Sumatriptan 50mg, Ibuprofen"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>

                    <!-- Notes / Triggers -->
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Notes / Potential Triggers</label>
                        <textarea id="entry-notes" rows="2" placeholder="e.g., Stress, lack of sleep, weather change..."
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Save Migraine Entry
                    </button>
                </form>
            </div>
        </section>

        <!-- TAB 2: HISTORY & DOCTOR REPORT -->
        <section id="tab-history" class="space-y-6 hidden">
            <!-- Controls Toolbar -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg flex flex-col sm:flex-row justify-between items-center gap-3 no-print">
                <div class="w-full sm:w-auto flex-1">
                    <input type="text" id="search-input" oninput="renderHistory()" placeholder="Search logs (medication, symptom, date)..."
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-print"></i> Print Doctor Report
                    </button>
                    <button onclick="exportData()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold px-3 py-2.5 rounded-xl transition" title="Export JSON backup">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
            </div>

            <!-- Header for Print Report -->
            <div class="print-only mb-6">
                <h1 class="text-2xl font-bold text-slate-900">Patient Migraine History Report</h1>
                <p class="text-xs text-slate-600 mt-1">Generated on <span id="print-date"></span></p>
                <hr class="my-3 border-slate-300">
            </div>

            <!-- Entries List -->
            <div id="history-container" class="space-y-3">
                <!-- Dynamically populated -->
            </div>
        </section>

    </main>

    <!-- App Logic -->
    <script>
        let migraines = JSON.parse(localStorage.getItem('migraine_logs') || '[]');

        // Set default datetime to now
        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('entry-datetime').value = now.toISOString().slice(0,16);
            document.getElementById('print-date').innerText = new Date().toLocaleDateString();
            renderHistory();
        });

        function switchTab(tab) {
            if (tab === 'log') {
                document.getElementById('tab-log').classList.remove('hidden');
                document.getElementById('tab-history').classList.add('hidden');
                document.getElementById('btn-tab-log').className = 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition';
                document.getElementById('btn-tab-history').className = 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition';
            } else {
                document.getElementById('tab-log').classList.add('hidden');
                document.getElementById('tab-history').classList.remove('hidden');
                document.getElementById('btn-tab-history').className = 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition';
                document.getElementById('btn-tab-log').className = 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition';
                renderHistory();
            }
        }

        function saveMigraine(e) {
            e.preventDefault();
            const datetime = document.getElementById('entry-datetime').value;
            const duration = document.getElementById('entry-duration').value;
            const severity = document.getElementById('entry-severity').value;
            const medication = document.getElementById('entry-medication').value.trim();
            const notes = document.getElementById('entry-notes').value.trim();

            const symptoms = Array.from(document.querySelectorAll('input[name="symptom"]:checked')).map(el => el.value);

            const newEntry = {
                id: Date.now(),
                datetime,
                duration,
                severity,
                symptoms,
                medication,
                notes
            };

            migraines.unshift(newEntry);
            localStorage.setItem('migraine_logs', JSON.stringify(migraines));

            // Reset form
            document.getElementById('migraine-form').reset();
            document.getElementById('severity-val').innerText = '5';
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('entry-datetime').value = now.toISOString().slice(0,16);

            // Show success alert
            const status = document.getElementById('form-status');
            status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 3000);
        }

        function deleteEntry(id) {
            if (confirm('Are you sure you want to delete this log entry?')) {
                migraines = migraines.filter(m => m.id !== id);
                localStorage.setItem('migraine_logs', JSON.stringify(migraines));
                renderHistory();
            }
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            const query = document.getElementById('search-input')?.value.toLowerCase() || '';

            const filtered = migraines.filter(m => {
                const textMatch = (m.medication + ' ' + m.notes + ' ' + m.datetime + ' ' + m.symptoms.join(' ')).toLowerCase();
                return textMatch.includes(query);
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-slate-800/50 border border-slate-700/60 rounded-2xl">
                        <i class="fa-regular fa-folder-open text-slate-500 text-3xl mb-2"></i>
                        <p class="text-sm text-slate-400">No migraine records found.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(m => {
                const dateFormatted = new Date(m.datetime).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
                return `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-md space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="text-xs font-bold text-indigo-400 uppercase tracking-wider">${dateFormatted}</div>
                                <div class="text-lg font-bold text-white mt-0.5">Severity: ${m.severity}/10 <span class="text-xs font-normal text-slate-400">(${m.duration} hours)</span></div>
                            </div>
                            <button onclick="deleteEntry(${m.id})" class="text-slate-500 hover:text-red-400 p-1 no-print transition" title="Delete entry">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                        ${m.symptoms.length > 0 ? `
                            <div class="flex flex-wrap gap-1.5">
                                ${m.symptoms.map(s => `<span class="bg-indigo-950 text-indigo-300 border border-indigo-800/60 text-[11px] px-2.5 py-0.5 rounded-full font-medium">${s}</span>`).join('')}
                            </div>
                        ` : ''}
                        <div class="text-xs text-slate-300 space-y-1">
                            ${m.medication ? `<div><span class="text-slate-400 font-medium">Medication:</span> ${escapeHtml(m.medication)}</div>` : ''}
                            ${m.notes ? `<div><span class="text-slate-400 font-medium">Notes:</span> ${escapeHtml(m.notes)}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(migraines, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "migraine_logs_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
